<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sổ tay cưới · địa điểm & dịch vụ</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f1;--panel:#fff;--ink:#1f2a37;--mute:#66717d;--line:#dde2dc;--plum:#7a3e65;--plum-d:#5d2c4c;--sage:#5e7f6e;--r:10px;
--f-head:'Bricolage Grotesque',system-ui,sans-serif;--f-body:'Be Vietnam Pro',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#161b20;--panel:#1f262d;--ink:#e8ecef;--mute:#9aa5b0;--line:#323b44;--plum:#d18ab8;--plum-d:#e6a9cf;--sage:#8fb5a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);height:100vh}
nav{padding:20px 14px;border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
nav h1{font:700 20px/1.2 var(--f-head);margin:0 0 4px;padding:0 8px}
nav .home{font-size:12px;color:var(--mute);padding:0 8px 16px}
nav .grp{font:600 12px var(--f-body);color:var(--mute);margin:14px 8px 4px}
nav button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:8px}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--plum);color:#fff}
nav button .n{opacity:.7;font-size:12px}
.tools{margin-top:20px;padding:12px 8px 0;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.tools button{width:auto;border:1px solid var(--line);font-size:12px;padding:5px 9px}
section.list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.head{padding:18px 18px 12px}
.head h2{font:700 22px/1.2 var(--f-head);margin:0}
.head p{margin:4px 0 12px;color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;text-decoration:none;color:var(--ink);font-size:13px;display:inline-block}
.btn.pri{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.cards{overflow:auto;padding:0 18px 24px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;border-left:5px solid var(--c,#8a94a0)}
.card.sel{box-shadow:0 0 0 2px var(--plum)}
.card.out{opacity:.55}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{margin:0;font:600 16px/1.3 var(--f-head);cursor:pointer}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--c);color:#fff;white-space:nowrap}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0;font-size:13px;color:var(--mute)}
.meta b{color:var(--ink);font-weight:600}
.card ul{margin:6px 0;padding-left:18px;font-size:13px}
.card .note{font-size:13px;color:var(--mute);margin:6px 0;white-space:pre-wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.empty{padding:28px 18px;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.route{margin:0 18px 12px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);font-size:13px}
.route ol{margin:6px 0 8px;padding-left:20px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(560px,94vw);padding:0}
dialog::backdrop{background:#0006}
.dlg{padding:20px;display:grid;gap:12px}
.dlg h3{margin:0;font:700 18px var(--f-head)}
.dlg label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.dlg input,.dlg select,.dlg textarea{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:9999}
@media(max-width:980px){.app{grid-template-columns:1fr;height:auto}nav{border-right:0;border-bottom:1px solid var(--line)}
nav .grp{display:inline-block}nav button{display:inline-flex;width:auto}section.list{border-right:0}.cards{overflow:visible}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <section class="list">
    <div class="head">
      <h2 id="title"></h2><p id="sub"></p>
      <div class="row"><button class="btn pri" id="add">Thêm địa điểm</button></div>
    </div>
    <div id="route"></div>
    <div class="cards" id="cards"></div>
  </section>
</div>

<dialog id="dlg"><div class="dlg">
  <h3 id="dtitle"></h3>
  <label>Tên địa điểm<input id="f_name"></label>
  <div class="g2">
    <label>Trạng thái<select id="f_status"></select></label>
    <label>Giá / gói<input id="f_price" placeholder="VD: 15M, ưu đãi còn 13M"></label>
  </div>
  <div class="g2">
    <label>Số điện thoại / Zalo<input id="f_phone"></label>
    <label>Link Google Maps / Facebook<input id="f_link"></label>
  </div>
  <label>Địa chỉ<input id="f_addr"></label>
  <label>Tọa độ, để tính khoảng cách (không bắt buộc; dán "lat,lng" hoặc link Google Maps dài có @lat,lng)<input id="f_pos" placeholder="10.8431, 106.8370"></label>
    <label>Dịch vụ & nội dung gói (mỗi dòng một ý)<textarea id="f_svc" rows="5"></textarea></label>
  <label>Ghi chú<textarea id="f_note" rows="2"></textarea></label>
  <div class="row" style="justify-content:space-between">
    <button class="btn sm" id="d_del" style="color:#b9505a">Xóa</button>
    <span class="row"><button class="btn" id="d_cancel">Hủy</button><button class="btn pri" id="d_save">Lưu</button></span>
  </div>
</div></dialog>
<input type="file" id="imp" accept="application/json" hidden>

<script>
const HOME={lat:10.8431,lng:106.8370,name:'Vinhomes Grand Park, Q9'};
const BMT={lat:12.6675,lng:108.0378};
const SEC=[
 {id:'pre',g:'Chụp pre-wedding',n:'TP.HCM',city:'hcm',d:'Studio chụp ảnh cưới ngoại cảnh'},
 {id:'cer-bmt',g:'Quay chụp lễ cưới',n:'Buôn Ma Thuột',city:'bmt',d:'Quay phim & chụp ảnh ngày cưới, ăn hỏi'},
 {id:'cer-hcm',g:'Quay chụp lễ cưới',n:'TP.HCM',city:'hcm',d:'Quay phim & chụp ảnh ngày cưới, ăn hỏi'},
 {id:'vest',g:'May vest',n:'TP.HCM',city:'hcm',d:'Tiệm may vest chú rể'},
 {id:'shoes',g:'Giày tây',n:'TP.HCM',city:'hcm',d:'Nơi mua giày tây (và guốc cô dâu)'},
 {id:'mk-bmt',g:'Trang điểm cô dâu',n:'Buôn Ma Thuột',city:'bmt',d:'Book trang điểm cô dâu'},
 {id:'mk-hcm',g:'Trang điểm cô dâu',n:'TP.HCM',city:'hcm',d:'Book trang điểm cô dâu'},
 {id:'ad-bmt',g:'Thuê áo dài',n:'Buôn Ma Thuột',city:'bmt',d:'Thuê áo dài cô dâu, chú rể'},
 {id:'ad-hcm',g:'Thuê áo dài',n:'TP.HCM',city:'hcm',d:'Thuê áo dài cô dâu, chú rể'}
];
const ST={'Chưa liên hệ':'#8a94a0','Đã liên hệ':'#3b82a0','Cân nhắc':'#c9822a','Đã chọn':'#3e8e63','Loại':'#b9505a'};
const KEY='so-tay-cuoi-v1';
const seed=()=>[
 {id:'s1',sec:'pre',name:'Le Thanh Phuong Bridal',status:'Chưa liên hệ',price:'17M (gói Ngoại Cảnh SG)',link:'https://maps.app.goo.gl/b5dSfsjK9ELixdG58',
  svc:'2 concept\n2 bộ váy cô dâu, 2 bộ vest chú rể\n35 ảnh chỉnh sửa\nPhotobook 20x30, 30 trang\n1 ảnh cổng ép gỗ 60x90\n10 ảnh để bàn 13x18 ép lụa\n1 slide\nGiao file gốc\nĐã gồm trang điểm & làm tóc'},
 {id:'s2',sec:'pre',name:"Win's Studio",status:'Chưa liên hệ',price:'15M, ưu đãi còn 13M (gói Ngoại Cảnh SG)',link:'https://maps.app.goo.gl/2Hk5XS9RmCkPvM4w5',
  svc:'3 concept: Rừng Q7, Kho Bạc, Hồng Kong\n3 váy, 3 vest + phụ kiện\n40 ảnh chỉnh sửa\nPhotobook 30x30 / 35x25, 30 trang\n1 ảnh cổng ép gỗ 60x90\n6 ảnh để bàn 13x18 ép lụa (không khung)\n1 slide\nGiao file gốc\nĐã gồm trang điểm & làm tóc'},
 {id:'s3',sec:'pre',name:'Doli Bridal',status:'Chưa liên hệ',price:'11M (gói Ngoại Cảnh SG)',link:'https://maps.app.goo.gl/gR3zuMaSRK2ts1wn7',
  svc:'3 concept\n2 váy basic, 2 vest\n50 ảnh chỉnh sửa\nPhotobook 30x30 / 35x25, 30 trang\n1 ảnh cổng ép gỗ 60x90\n10 ảnh để bàn 13x18 ép lụa\n1 slide + 1 web lưu ảnh\nGiao file gốc\nĐã gồm trang điểm & làm tóc'},
 {id:'s4',sec:'pre',name:'Helen Bridal',status:'Chưa liên hệ',price:'15M (gói Ngoại Cảnh SG)',link:'https://maps.app.goo.gl/s4yuT4tvUoRj5nwE8',
  svc:'2 concept ngoại cảnh + 1 concept studio\n2 váy, 2 vest\n42 ảnh chỉnh sửa\nPhotobook 30x30, 30 trang\n1 ảnh cổng ép gỗ 60x90 (tặng up tráng gương)\n10 ảnh để bàn 13x18 (tặng đổi 15x21 tráng gương, 6 tấm)\n1 slide\nGiao file gốc\nĐã gồm trang điểm & làm tóc'}
];
let S={places:seed()},cur='pre',editing=null,sel=null;
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sec=()=>SEC.find(s=>s.id===cur);
const origin=()=>sec().city==='hcm'?HOME:null;
const has=p=>typeof p.lat==='number'&&typeof p.lng==='number';
function km(a,b){const R=6371,t=x=>x*Math.PI/180,dLa=t(b.lat-a.lat),dLo=t(b.lng-a.lng);
 const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmt=k=>k.toFixed(1).replace('.',',')+' km';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
const dest=p=>has(p)?`${p.lat},${p.lng}`:(p.addr||p.name+' '+sec().n);

function nav(){
 let h=`<h1>Sổ tay cưới</h1><div class="home">Xuất phát: ${HOME.name}</div>`,g='';
 SEC.forEach(s=>{if(s.g!==g){g=s.g;h+=`<div class="grp">${g}</div>`}
  const n=S.places.filter(p=>p.sec===s.id&&p.status!=='Loại').length;
  h+=`<button data-s="${s.id}" class="${s.id===cur?'on':''}">${s.n}<span class="n">${n}</span></button>`});
 h+=`<div class="tools"><button id="exp">Xuất JSON</button><button id="impb">Nhập JSON</button></div>`;
 $('nav').innerHTML=h;
 $('nav').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{cur=b.dataset.s;sel=null;render()});
 $('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='so-tay-cuoi.json';a.click()};
 $('impb').onclick=()=>$('imp').click();
}
$('imp').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.places))throw 0;S=d;save();render();toast('Đã nhập dữ liệu')}catch(x){toast('File JSON không hợp lệ')}};

function ordered(list){
 const o=origin(),a=list.filter(has),b=list.filter(p=>!has(p));if(!o)return list;
 const left=[...a],out=[];let c=o;
 while(left.length){let bi=0,bd=1e9;left.forEach((p,i)=>{const d=km(c,p);if(d<bd){bd=d;bi=i}});const p=left.splice(bi,1)[0];out.push(p);c=p}
 return out.concat(b);
}
function dirUrl(list,from){
 const pts=list.map(dest);if(!pts.length)return null;
 const q=new URLSearchParams({api:1,destination:pts[pts.length-1],travelmode:'driving'});
 if(from)q.set('origin',`${from.lat},${from.lng}`);
 if(pts.length>1)q.set('waypoints',pts.slice(0,-1).slice(0,9).join('|'));
 return 'https://www.google.com/maps/dir/?'+q;
}
function list(){return S.places.filter(p=>p.sec===cur)}
function render(){
 nav();const s=sec();$('title').textContent=`${s.g} · ${s.n}`;$('sub').textContent=s.d;
 const all=list(),o=origin();
 const view=[...all].sort((a,b)=>(o&&has(a)&&has(b))?km(o,a)-km(o,b):(has(b)-has(a)));
 const active=ordered(all.filter(p=>p.status!=='Loại'&&p.status!=='Đã liên hệ'));
 const r=$('route');
 if(active.length){
  const u=dirUrl(active,o);let tot=0,c=o;active.forEach(p=>{if(c&&has(p)){tot+=km(c,p);c=p}});
  r.innerHTML=`<div class="route"><b>Lộ trình gợi ý${o?' từ nhà':''}</b> <span style="color:var(--mute)">(chưa tính nơi đã liên hệ)</span>${o&&tot?` · ~${fmt(tot)} đường chim bay`:''}<ol>${active.map(p=>`<li>${esc(p.name)}</li>`).join('')}</ol><a class="btn pri sm" target="_blank" rel="noopener" href="${u}">Mở chỉ đường Google Maps</a></div>`;
 }else r.innerHTML='';
 $('cards').innerHTML=view.length?view.map(p=>{
  const c=ST[p.status]||'#8a94a0',d=o&&has(p)?fmt(km(o,p)):null;
  const items=(p.svc||'').split('\n').filter(x=>x.trim());
  return `<article class="card ${p.id===sel?'sel':''} ${p.status==='Loại'?'out':''}" style="--c:${c}" data-id="${p.id}">
   <div class="top"><h3>${esc(p.name)}</h3><span class="pill">${p.status}</span></div>
   <div class="meta">${p.price?`<span>Giá: <b>${esc(p.price)}</b></span>`:''}${d?`<span>Cách nhà: <b>${d}</b></span>`:''}${p.phone?`<span><a href="tel:${esc(p.phone)}">${esc(p.phone)}</a></span>`:''}</div>
   ${p.addr?`<div class="note">${esc(p.addr)}</div>`:''}
   ${items.length?`<ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
   ${p.note?`<div class="note">${esc(p.note)}</div>`:''}
   <div class="acts"><a class="btn sm" target="_blank" rel="noopener" href="${dirUrl([p],o)}">Chỉ đường</a>${p.link?`<a class="btn sm" target="_blank" rel="noopener" href="${esc(p.link)}">Mở link</a>`:''}<button class="btn sm" data-e="${p.id}">Sửa</button></div>
  </article>`}).join(''):`<div class="empty">Chưa có địa điểm nào trong mục này.<br>Bấm "Thêm địa điểm" để bắt đầu.</div>`;
 $('cards').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>openEdit(b.dataset.e));
 $('cards').querySelectorAll('.card h3').forEach(h=>h.onclick=()=>{sel=h.closest('.card').dataset.id;render()});
}
function parsePos(v){
 let m=v.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||v.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||v.match(/(-?\d+\.\d+)\s*[,; ]\s*(-?\d+\.\d+)/);
 return m?{lat:+m[1],lng:+m[2]}:null;
}
function openEdit(id){
 editing=id?S.places.find(p=>p.id===id):null;const p=editing||{};
 $('dtitle').textContent=editing?'Sửa địa điểm':'Thêm địa điểm';
 $('f_status').innerHTML=Object.keys(ST).map(k=>`<option ${k===(p.status||'Chưa liên hệ')?'selected':''}>${k}</option>`).join('');
 $('f_name').value=p.name||'';$('f_price').value=p.price||'';$('f_phone').value=p.phone||'';$('f_link').value=p.link||'';
 $('f_addr').value=p.addr||'';$('f_pos').value=has(p)?`${p.lat}, ${p.lng}`:'';$('f_svc').value=p.svc||'';$('f_note').value=p.note||'';
 $('d_del').style.visibility=editing?'visible':'hidden';$('dlg').showModal();
}
$('add').onclick=()=>openEdit();
$('d_cancel').onclick=()=>$('dlg').close();
$('d_del').onclick=()=>{if(confirm('Xóa địa điểm này?')){S.places=S.places.filter(p=>p!==editing);save();$('dlg').close();render()}};
$('d_save').onclick=()=>{
 const name=$('f_name').value.trim();if(!name){toast('Cần nhập tên địa điểm');return}
 const pos=parsePos($('f_pos').value),p=editing||{id:'p'+Date.now(),sec:cur};
 Object.assign(p,{name,status:$('f_status').value,price:$('f_price').value.trim(),phone:$('f_phone').value.trim(),link:$('f_link').value.trim(),addr:$('f_addr').value.trim(),svc:$('f_svc').value,note:$('f_note').value});
 if(pos){p.lat=pos.lat;p.lng=pos.lng}else{delete p.lat;delete p.lng}
 if(!editing)S.places.push(p);save();$('dlg').close();render();
};
render();
</script>
</body>
</html>
